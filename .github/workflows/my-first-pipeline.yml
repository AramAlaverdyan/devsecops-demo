name: DevSecOps SAST Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Security Tools
      run: pip install bandit

    # Ավելացրինք -ll դրոշակը
    - name: Run Bandit SAST Scan
      run: bandit -r . -ll
