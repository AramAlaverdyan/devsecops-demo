name: DevSecOps Ultimate Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # ԿԱՐԵՎՈՐ Է. Սա հրահանգում է քաշել ամբողջ Git պատմությունը, որ Gitleaks-ը կարողանա հին commit-ներն էլ ստուգել

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Security Tools
      run: pip install bandit pip-audit

    - name: Run Bandit SAST Scan
      run: bandit -r . -ll

    - name: Run pip-audit SCA Scan
      run: pip-audit -r requirements.txt

    # ՆՈՐ ՔԱՅԼ. Գաղտնիքների որս Gitleaks-ով
    - name: Run Gitleaks Secrets Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Սա ավտոմատ տրվում է GitHub-ի կողմից
