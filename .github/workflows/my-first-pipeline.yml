name: DevSecOps SAST Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Քաշում ենք կոդը
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Տեղադրում ենք Python սերվերի վրա
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Տեղադրում ենք Bandit սկաները
    - name: Install Security Tools
      run: pip install bandit

    # 4. Աշխատացնում ենք սկաները մեր ամբողջ կոդի վրա
    - name: Run Bandit SAST Scan
      run: bandit -r .
